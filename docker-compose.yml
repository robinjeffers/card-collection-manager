services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cards}
      POSTGRES_DB: ${POSTGRES_DB:-cards}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once on first boot to create the schema in an empty volume.
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cards} -d ${POSTGRES_DB:-cards}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cards}:${POSTGRES_PASSWORD:-cards}@db:5432/${POSTGRES_DB:-cards}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in your .env}
      # Set this to the public URL the app is served from (e.g. your
      # Cloudflare Tunnel hostname) so auth cookies and origins are correct.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Optional extra origins allowed to sign in (comma-separated). Needed when
      # you reach the app on more than one hostname, e.g. the tunnel domain AND
      # http://localhost:3000. See .env.example.
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      # Uploaded card artwork is written here; the volume below persists it
      # across restarts and is served back through the app (works over the
      # Cloudflare Tunnel like any other request).
      UPLOAD_DIR: /data/uploads
      # Comma-separated admin emails. These accounts get admin access
      # automatically on sign-in. See .env.example.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Leave unset for invite-only (admins create accounts); "true" allows
      # public self-service signup. See .env.example.
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
      # Optional: auto-create this admin account on first boot so you can keep
      # signup disabled from the very first run. See .env.example.
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Admin}
      NODE_ENV: production
    volumes:
      - uploads-data:/data/uploads
    ports:
      - "3000:3000"

# Persistent storage for the app. By default these are Docker-managed named
# volumes (kept under Docker's own storage area and preserved across
# `docker compose down` / restarts / image rebuilds).
#
# This is the location for all persistent data:
#   - db-data      -> database metadata: collections, columns, tags, and the
#                     text/number values on each card (Postgres data directory).
#   - uploads-data -> card artwork, generated grid thumbnails (.thumb.webp),
#                     and uploaded template files (mapped to UPLOAD_DIR above).
#
# To store this data at a specific location on the host instead (so you can
# browse or back it up directly), replace the named volume with a bind mount of
# the form `HOST_PATH:CONTAINER_PATH`, changing ONLY the host (left) side.
# Point the two mounts under one folder, for example:
#
#   services:
#     db:
#       volumes:
#         - /your/host/path/db:/var/lib/postgresql/data
#     app:
#       volumes:
#         - /your/host/path/uploads:/data/uploads
#
# The container (right) paths must stay as shown so they match the app's
# UPLOAD_DIR and the Postgres data directory. When bind-mounting every volume,
# this bottom `volumes:` block can be removed entirely.
volumes:
  db-data:
  uploads-data:
